openapi: 3.0.0
info:
  title: Delícias da Lú API
  version: 1.0.0
  description: Complete REST API for managing bakery menu, custom cake orders, and admin configurations. Includes error tracking with trace IDs for debugging.
  contact:
    name: Support
    url: https://delicias-da-lu.com.br
  license:
    name: MIT

servers:
  - url: https://delicias-da-lu-514609008596.southamerica-east1.run.app/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login endpoint

  schemas:
    # ==================== Menu Schemas ====================
    MenuItem:
      type: object
      required: [id, name, category, price, active]
      properties:
        id:
          type: string
          example: "frutas-abacaxi-creme"
          description: Unique identifier for menu item
        name:
          type: string
          example: "Abacaxi com Creme"
          description: Item name
        category:
          type: string
          example: "Sabores de Frutas"
          description: Category/section for grouping items
        price:
          type: number
          format: float
          example: 65.00
          description: Price in BRL
        unit:
          type: string
          example: "kg"
          description: Unit of measurement (e.g., "kg", "unidade")
        image:
          type: string
          example: "/images/bolos/frutas-abacaxi-creme.jpg"
          description: Image path relative to CDN
        description:
          type: string
          example: "Soft cake with layers of fresh pineapple and cream"
          description: Detailed item description
        active:
          type: boolean
          example: true
          description: Whether item is available for ordering
        order:
          type: integer
          example: 1
          description: Display order within category
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    # ==================== Cake Builder Schemas ====================
    CakeBuilderComponent:
      type: object
      required: [id, name, type, price, active]
      properties:
        id:
          type: string
          example: "massa-chocolate"
          description: Unique component identifier
        name:
          type: string
          example: "Chocolate"
          description: Component name
        type:
          type: string
          enum: [massa, recheio, cobertura, decoracao]
          example: "massa"
          description: Component type (dough, filling, topping, decoration)
        price:
          type: number
          format: float
          example: 15.50
          description: Price per unit
        image:
          type: string
          example: "/images/cake-builder/massas/chocolate.jpg"
          description: Component image
        active:
          type: boolean
          example: true
          description: Whether component is available
        order:
          type: integer
          example: 1
          description: Display order within type
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    CakeBuilderAll:
      type: object
      properties:
        massas:
          type: array
          items:
            $ref: '#/components/schemas/CakeBuilderComponent'
          description: Available dough options
        recheios:
          type: array
          items:
            $ref: '#/components/schemas/CakeBuilderComponent'
          description: Available filling options
        coberturas:
          type: array
          items:
            $ref: '#/components/schemas/CakeBuilderComponent'
          description: Available topping options
        decoracoes:
          type: array
          items:
            $ref: '#/components/schemas/CakeBuilderComponent'
          description: Available decoration options

    FeaturedCake:
      type: object
      required: [id, name, description, image]
      properties:
        id:
          type: string
          example: "ninho-nutella"
          description: Unique featured cake identifier
        name:
          type: string
          example: "Ninho com Nutella"
          description: Featured cake name
        description:
          type: string
          example: "Delicious cake with Ninho cream and Nutella"
          description: Detailed description
        image:
          type: string
          example: "/images/home/ninho-nutella.jpg"
          description: Image path
        order:
          type: integer
          example: 1
          description: Display order on home page
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    # ==================== Order Schemas ====================
    Order:
      type: object
      required: [id, items, customerInfo, status, totalPrice]
      properties:
        id:
          type: string
          example: "order-20260614-001"
          description: Unique order identifier
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          description: Ordered items (menu items or custom cakes)
        customerInfo:
          $ref: '#/components/schemas/CustomerInfo'
          description: Customer contact and delivery information
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, delivered, cancelled]
          example: "pending"
          description: Current order status
        totalPrice:
          type: number
          format: float
          example: 150.50
          description: Total order price
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last order update timestamp

    OrderItem:
      type: object
      required: [type, quantity, unitPrice, subtotal]
      properties:
        type:
          type: string
          enum: [menu, cakeBuilder]
          example: "menu"
          description: Item type - either menu item or custom cake
        menuItemId:
          type: string
          example: "frutas-abacaxi-creme"
          description: Menu item ID (required if type is "menu")
        cakeCustomization:
          type: object
          example:
            massa: "massa-chocolate"
            recheio: "recheio-morango"
            cobertura: "cobertura-brigadeiro"
            decoracao: "decoracao-confeitos"
          description: Custom cake components (required if type is "cakeBuilder")
        quantity:
          type: integer
          minimum: 1
          example: 2
          description: Quantity ordered
        unitPrice:
          type: number
          format: float
          example: 45.99
          description: Price per unit
        subtotal:
          type: number
          format: float
          example: 91.98
          description: Total for this item (quantity × unitPrice)

    CustomerInfo:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          example: "João Silva"
          description: Customer name
        phone:
          type: string
          example: "11999999999"
          description: Contact phone number (WhatsApp preferred)
        email:
          type: string
          format: email
          example: "joao@example.com"
          description: Customer email address
        deliveryDate:
          type: string
          format: date
          example: "2026-06-15"
          description: Desired delivery date (YYYY-MM-DD)
        notes:
          type: string
          example: "Sem amendoim - alérgico. Entregar na sala de reuniões."
          description: Special instructions and allergies

    OrderListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 42
          description: Total orders matching filter
        limit:
          type: integer
          example: 10
          description: Items per page
        offset:
          type: integer
          example: 0
          description: Pagination offset
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    CreateOrderRequest:
      type: object
      required: [items, customerInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          minItems: 1
        customerInfo:
          $ref: '#/components/schemas/CustomerInfo'

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, delivered, cancelled]
          example: "confirmed"

    # ==================== Contact Schemas ====================
    Contact:
      type: object
      properties:
        whatsapp:
          $ref: '#/components/schemas/WhatsAppInfo'
        email:
          type: string
          format: email
          example: "contato@delicias-da-lu.com.br"
        instagram:
          type: string
          example: "delicias_da_lu"
        address:
          type: string
          example: "Rua das Flores, 123 - Centro"
        phone:
          type: string
          example: "1133334444"

    WhatsAppInfo:
      type: object
      properties:
        number:
          type: string
          example: "5511987654321"
        link:
          type: string
          example: "https://wa.me/5511987654321"

    # ==================== Config Schemas ====================
    SiteConfig:
      type: object
      properties:
        menu:
          $ref: '#/components/schemas/MenuConfig'
        cakeBuilder:
          $ref: '#/components/schemas/CakeBuilderConfig'
        contacts:
          $ref: '#/components/schemas/Contact'

    MenuConfig:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        sectionLabels:
          type: object
          additionalProperties:
            type: string
          example:
            bolos: "🍰 Bolos"
            doces: "🍬 Doces"
        customSections:
          type: array
          items:
            type: string

    CakeBuilderConfig:
      type: object
      properties:
        massas:
          type: array
          items:
            $ref: '#/components/schemas/CakeBuilderComponent'
        recheios:
          type: array
          items:
            $ref: '#/components/schemas/CakeBuilderComponent'
        coberturas:
          type: array
          items:
            $ref: '#/components/schemas/CakeBuilderComponent'
        decoracoes:
          type: array
          items:
            $ref: '#/components/schemas/CakeBuilderComponent'

    UpdateConfigRequest:
      type: object
      properties:
        menu:
          $ref: '#/components/schemas/MenuConfig'
        cakeBuilder:
          $ref: '#/components/schemas/CakeBuilderConfig'
        contacts:
          $ref: '#/components/schemas/Contact'

    # ==================== Auth Schemas ====================
    LoginRequest:
      type: object
      required: [username, passwordHash]
      properties:
        username:
          type: string
          example: "juliosshoji"
        passwordHash:
          type: string
          example: "8d969eef6ecad3c29a3a873fba8fe814ea412bfce19db27c81052fe959408b8515"
          description: |
            SHA256 hash of the password (hex encoded).
            Client must hash password before sending to prevent transmission of plain text.
            Hash can be generated using: sha256(password).hexdigest() in Python or 
            crypto.createHash('sha256').update(password).digest('hex') in Node.js

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
        user:
          $ref: '#/components/schemas/AdminUser'

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token from previous login

    RefreshTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: New JWT authentication token

    AdminUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, manager]
        lastLogin:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ==================== Error Schemas ====================
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: "https://delicias-da-lu-service.com/docs/errors/not-found"
          description: Error type URI
        title:
          type: string
          example: "Not Found"
          description: Human-readable error summary
        detail:
          type: string
          example: "No menu item found with ID: invalid-id-99999"
          description: Detailed error explanation
        instance:
          type: string
          example: "https://api.delicias-da-lu.com.br/v1/menu/items/invalid-id-99999"
          description: Request URI that caused the error
        status:
          type: integer
          example: 404
          description: HTTP status code
        traceId:
          type: string
          example: "a1b2c3d4e5f6g7h8"
          description: Request trace ID for error lookup

    ErrorType:
      type: object
      properties:
        identifier:
          type: string
          example: "not-found"
        html:
          type: string
          description: HTML documentation for error type
        updatedAt:
          type: string
          format: date-time

    ErrorInstance:
      type: object
      properties:
        traceId:
          type: string
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        requestUrl:
          type: string
        requestDate:
          type: string
          format: date-time
        requestBody:
          type: string
        userAgent:
          type: string
        html:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time

paths:
  # ==================== HEALTH ====================
  /health:
    get:
      summary: Health Check
      description: Verify API is running and database connection is healthy
      tags:
        - Health
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unhealthy

  # ==================== AUTHENTICATION ====================
  /auth/login:
    post:
      summary: Admin Login
      description: |
        Authenticate with username and SHA256-hashed password to get JWT token.
        
        **IMPORTANT - Client-Side Password Hashing:**
        - Client must hash the password using SHA256 before sending
        - Plain text passwords must NEVER be transmitted
        - Example: sha256("password123").hexdigest() in Python
        - This ensures passwords are never exposed in transit
        
        **MUST use HTTPS in production** to encrypt the hashed password
        
        See docs/CLIENT-SIDE-PASSWORD-HASHING.md for implementation details and code examples
      tags:
        - Authentication
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/refresh:
    post:
      summary: Refresh JWT Token
      description: Get a new JWT token using refresh token
      tags:
        - Authentication
      operationId: refreshToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Unauthorized - invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/upload:
    post:
      summary: Upload Image
      description: Upload image for menu items, cake builder components, or featured cakes
      tags:
        - Upload
      operationId: uploadImage
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [menu, cakeBuilder, home]
          description: Upload type
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Category (required for menu and cakeBuilder)
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Item ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, WebP max 5MB)
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: "https://storage.googleapis.com/delicias-da-lu-images/menu/bolos/item-id.jpg?token=..."
                  path:
                    type: string
                    example: "menu/bolos/item-id.jpg"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      summary: Delete Image
      description: Delete image from storage
      tags:
        - Upload
      operationId: deleteImage
      security:
        - BearerAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: File path to delete
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /home/featured-cakes:
    get:
      summary: Get Featured Cakes
      description: Retrieve all featured cakes for home page
      tags:
        - Home
      operationId: getFeaturedCakes
      responses:
        '200':
          description: Featured cakes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeaturedCake'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    post:
      summary: Create Featured Cake
      description: Add featured cake to home page (admin only)
      tags:
        - Home
      operationId: createFeaturedCake
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeaturedCake'
      responses:
        '201':
          description: Featured cake created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedCake'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /home/featured-cakes/{id}:
    get:
      summary: Get Featured Cake by ID
      description: Retrieve specific featured cake details
      tags:
        - Home
      operationId: getFeaturedCakeById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Featured cake details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedCake'
        '404':
          description: Featured cake not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    put:
      summary: Update Featured Cake
      description: Update featured cake details (admin only)
      tags:
        - Home
      operationId: updateFeaturedCake
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeaturedCake'
      responses:
        '200':
          description: Featured cake updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedCake'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Featured cake not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      summary: Delete Featured Cake
      description: Remove featured cake from home page (admin only)
      tags:
        - Home
      operationId: deleteFeaturedCake
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Featured cake deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Featured cake not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  # ==================== MENU ====================
  /menu/items:
    get:
      summary: List All Menu Items
      description: Get all available menu items, optionally filtered by status or category
      tags:
        - Menu
      operationId: listMenuItems
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
          description: Filter by active status
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
      responses:
        '200':
          description: Menu items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    post:
      summary: Create Menu Item
      description: Add new menu item (admin only)
      tags:
        - Menu
      operationId: createMenuItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItem'
      responses:
        '201':
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /menu/items/{id}:
    get:
      summary: Get Menu Item by ID
      description: Retrieve a specific menu item details
      tags:
        - Menu
      operationId: getMenuItemById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "frutas-abacaxi-creme"
      responses:
        '200':
          description: Menu item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    put:
      summary: Update Menu Item
      description: Update menu item details (admin only)
      tags:
        - Menu
      operationId: updateMenuItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItem'
      responses:
        '200':
          description: Menu item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      summary: Delete Menu Item
      description: Remove a menu item (admin only)
      tags:
        - Menu
      operationId: deleteMenuItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Menu item deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
