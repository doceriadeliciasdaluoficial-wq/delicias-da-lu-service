  # ==================== ERROR TRACKING ====================
  /error:
    get:
      summary: Get Error Documentation
      description: Retrieve error type documentation or error instance details
      tags:
        - Error Tracking
      operationId: getError
      parameters:
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum: [type, instance]
          description: Filter type - "type" for error type docs, "instance" for specific error
        - name: identifier
          in: query
          required: true
          schema:
            type: string
          description: Error type identifier or trace ID
      responses:
        '200':
          description: Error documentation or instance
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorType'
                  - $ref: '#/components/schemas/ErrorInstance'
        '404':
          description: Error type or instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/error-types:
    post:
      summary: Create Error Type (Admin)
      description: Create new error type documentation (admin only)
      tags:
        - Error Tracking
      operationId: createErrorType
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                html:
                  type: string
      responses:
        '201':
          description: Error type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorType'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /admin/error-types/{identifier}:
    delete:
      summary: Delete Error Type (Admin)
      description: Delete error type documentation (admin only)
      tags:
        - Error Tracking
      operationId: deleteErrorType
      security:
        - BearerAuth: []
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Error type deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Error type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

